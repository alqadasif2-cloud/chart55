name: Frontend & Code Quality CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate-web:
    name: Build & TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 4. TypeScript Typecheck
        run: npm run lint

      - name: 5. Build Vite SPA
        run: npm run build
