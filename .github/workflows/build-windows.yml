name: Build Windows Desktop App (MetaTrader 5 Edition)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable (x64)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Frontend Dependencies (Windows Native Bindings)
        shell: pwsh
        run: |
          # Fix npm cross-platform optional dependency bug (npm/cli#4828)
          Remove-Item -Force -ErrorAction SilentlyContinue package-lock.json
          npm install --legacy-peer-deps
          # Explicitly ensure Windows native binaries for Rolldown & esbuild are installed
          npm install --no-save @rolldown/binding-win32-x64-msvc @esbuild/win32-x64 --legacy-peer-deps

      - name: 4. Build React / Vite Frontend
        run: npm run build

      - name: 5. Set up Python 3.11 64-bit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 6. Upgrade Pip and Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "windows\backend\requirements.txt") {
            python -m pip install -r windows\backend\requirements.txt
          } elseif (Test-Path "backend\requirements.txt") {
            python -m pip install -r backend\requirements.txt
          }

      - name: 7. Run Pre-Flight Environment & MT5 Diagnostics
        shell: pwsh
        run: |
          if (Test-Path "windows\backend\check_env.py") {
            python windows\backend\check_env.py
          } elseif (Test-Path "backend\check_env.py") {
            python backend\check_env.py
          }

      - name: 8. Package Application with PyInstaller
        shell: pwsh
        run: |
          $mainScript = if (Test-Path "windows\backend\main.py") { "windows\backend\main.py" } else { "backend\main.py" }
          Write-Host "Packaging using entrypoint: $mainScript"

          python -m PyInstaller --clean -y `
            --name="cchart_mt5" `
            --windowed `
            --add-data "dist;dist" `
            --add-data "windows/backend;windows/backend" `
            --add-data "backend;backend" `
            $mainScript

      - name: 9. Compress Application Folder to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\cchart_mt5\* -DestinationPath dist\cchart_mt5_windows_x64.zip -Force

      - name: 10. Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cchart_mt5_windows_x64
          path: dist/cchart_mt5_windows_x64.zip
          retention-days: 14
          if-no-files-found: warn

      - name: 11. Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cchart_mt5_windows_x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
