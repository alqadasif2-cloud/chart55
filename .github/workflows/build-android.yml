name: Build Android App (APK)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (Capacitor & Web Assets)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install Frontend & Capacitor Dependencies
        run: |
          npm install --legacy-peer-deps --include=dev
          npm install @capacitor/core@^8.6.0 @capacitor/android@^8.6.0 @capacitor/cli@^8.6.0 --legacy-peer-deps

      - name: 4. Build Original React / Vite Frontend
        run: npm run build

      - name: 5. Sync Web Assets to Android via Capacitor
        run: |
          npx @capacitor/cli sync android

      - name: 6. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: 7. Auto-Accept Preinstalled Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: 8. Build Native Android APK with Gradle
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Locate Built APK
        run: |
          echo "Listing generated APKs:"
          ls -la android/app/build/outputs/apk/debug/ || ls -R android/app/build/outputs/

      - name: 10. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cchart-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: 11. Create or Update GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
