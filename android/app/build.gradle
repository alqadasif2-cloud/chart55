apply plugin: 'com.android.application'

def getPropertyOrDefault(String propName, Object defaultValue) {
    if (rootProject.hasProperty(propName)) {
        return rootProject.property(propName)
    }
    if (rootProject.ext.has(propName)) {
        return rootProject.ext.get(propName)
    }
    return defaultValue
}

android {
    namespace "com.cchart.app"
    compileSdk (getPropertyOrDefault('compileSdkVersion', 34) as Integer)

    defaultConfig {
        applicationId "com.cchart.app"
        minSdk (getPropertyOrDefault('minSdkVersion', 24) as Integer)
        targetSdk (getPropertyOrDefault('targetSdkVersion', 34) as Integer)
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    def appCompatVer = getPropertyOrDefault('androidxAppCompatVersion', '1.7.0')
    def coordLayoutVer = getPropertyOrDefault('androidxCoordinatorLayoutVersion', '1.2.0')
    def splashVer = getPropertyOrDefault('coreSplashScreenVersion', '1.0.1')

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$appCompatVer"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$coordLayoutVer"
    implementation "androidx.core:core-splashscreen:$splashVer"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
